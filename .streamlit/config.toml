[theme]
font = "sans serif"
showSidebarBorder = true

[theme.light]
primaryColor = "#138a7d"
backgroundColor = "#f7f7f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d20"
borderColor = "#e2e2dd"

[theme.dark]
primaryColor = "#2fb7a6"
backgroundColor = "#101012"
secondaryBackgroundColor = "#18181b"
textColor = "#ececef"
borderColor = "#2c2c31"
linkColor = "#7fd8cc"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
